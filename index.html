<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundScape — Main Studio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="top-nav">
        <div class="brand">
            <div class="logo-icon">🎙️</div>
            <div>
                <h1 data-i18n="brandTitle">SoundScape</h1>
            </div>
        </div>
        <div class="nav-controls">
            <button id="themeToggle" class="icon-btn">🌙</button>
            <button id="langToggle" class="lang-btn">AR</button>
        </div>
    </nav>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <a href="index.html" class="nav-link active"><span>📊</span> <span data-i18n="navStudio">Main Studio</span></a>
            <a href="soundboard.html" class="nav-link"><span>🎛️</span> <span data-i18n="navSoundboard">Soundboard</span></a>
            <a href="mixer.html" class="nav-link"><span>🌊</span> <span data-i18n="navMixer">Ambient Mixer</span></a>
            <a href="library.html" class="nav-link"><span>📁</span> <span data-i18n="navLibrary">Recordings</span></a>
        </aside>

        <div class="main-content">
            <header class="studio-header">
                <button id="startStudioBtn" class="btn btn-primary"><span data-i18n="startEngine">Start Audio Engine</span></button>
                <div class="recording-controls">
                    <span id="timerDisplay">00:00:00</span>
                    <button id="recordBtn" class="btn btn-danger disabled" disabled><span data-i18n="record">Record</span></button>
                </div>
            </header>

            <section class="card">
                <h2>Master Spectrum</h2>
                <div class="canvas-wrapper">
                    <canvas id="audioVisualizer"></canvas>
                </div>
            </section>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
