<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundScape - Ambient Mixer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
       <nav style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background: var(--card-bg); border-bottom: 1px solid var(--border-color);">
    <h1 style="font-size: 1.25rem; color: var(--primary-color);">🎙️ SoundScape Studio</h1>
    <ul style="display: flex; list-style: none; gap: 1.5rem; margin: 0;">
        <li><a href="index.html" class="nav-link">Studio</a></li>
        <li><a href="soundboard.html" class="nav-link">Soundboard</a></li>
        <li><a href="mixer.html" class="nav-link">Mixer</a></li>
        <li><a href="library.html" class="nav-link">Library</a></li>
    </ul>
</nav>
    </header>

    <main class="page-container">
        <h2>Ambient Background Mixer</h2>
        <p style="color: var(--text-muted);">Blend background soundscapes for immersive recording sessions.</p>
        
        <div class="control-panel" style="margin-top: 2rem;">
            <div class="control-panel-group">
                <label>🌧️ Rain Ambience Volume: <span id="rainVal">0</span>%</label>
                <input type="range" id="rainSlider" min="0" max="100" value="0">
            </div>
            <div class="control-panel-group">
                <label>🌊 Ocean Waves Volume: <span id="wavesVal">0</span>%</label>
                <input type="range" id="wavesSlider" min="0" max="100" value="0">
            </div>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
