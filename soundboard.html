<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundScape - Soundboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background: var(--card-bg); border-bottom: 1px solid var(--border-color);">
    <h1 style="font-size: 1.25rem; color: var(--primary-color);">🎙️ SoundScape Studio</h1>
    <ul style="display: flex; list-style: none; gap: 1.5rem; margin: 0;">
        <li><a href="index.html" class="nav-link">Studio</a></li>
        <li><a href="soundboard.html" class="nav-link">Soundboard</a></li>
        <li><a href="mixer.html" class="nav-link">Mixer</a></li>
        <li><a href="library.html" class="nav-link">Library</a></li>
    </ul>
</nav>
    </header>

    <main class="page-container">
        <h2>Interactive Soundboard</h2>
        <p style="color: var(--text-muted);">Trigger live sound effects for your podcast production.</p>
        <div class="grid-pads">
            <button class="pad-btn" onclick="playSound('applause')">👏 Applause</button>
            <button class="pad-btn" onclick="playSound('laugh')">😂 Laugh Track</button>
            <button class="pad-btn" onclick="playSound('bell')">🔔 Bell Ring</button>
            <button class="pad-btn" onclick="playSound('drum')">🥁 Drum Roll</button>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
